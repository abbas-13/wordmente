name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The end-to-end suite is the only part that can check layout and the native
      # dialog, so it runs last: a failure here is about the rendered app rather
      # than the code the checks above already cleared.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
